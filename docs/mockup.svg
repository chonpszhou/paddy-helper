  <text x="222" y="507" font-family="sans-serif" font-size="24" fill="#6B7480">聚餐</text>
  <text x="306" y="507" font-family="sans-serif" font-size="24" fill="#6B7480">户外</text>
  <text x="390" y="507" font-family="sans-serif" font-size="24" fill="#6B7480">团体</text>
  <text x="474" y="507" font-family="sans-serif" font-size="24" fill="#6B7480">旅行</text>

  <!-- Feature 卡 -->
  <rect x="108" y="566" width="424" height="330" rx="30" fill="#FFFFFF" opacity="0.7"/>
  <rect x="124" y="582" width="392" height="250" rx="22" fill="url(#cover)"/>
  <rect x="148" y="606" width="120" height="46" rx="23" fill="#FFFFFF" opacity="0.28"/>
  <text x="208" y="636" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">🍲 聚餐</text>
  <text x="148" y="720" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">周末家宴·暖锅局</text>
