  </defs>

  <!-- 机身 -->
  <rect x="60" y="30" width="520" height="1120" rx="64" fill="#1C1F26"/>
  <rect x="76" y="46" width="488" height="1088" rx="52" fill="url(#aurora)"/>

  <!-- 状态栏 -->
  <rect x="240" y="66" width="160" height="30" rx="15" fill="#11151C"/>
  <text x="108" y="90" font-family="sans-serif" font-size="24" fill="#0E1116">9:41</text>

  <!-- 问候 -->
  <text x="108" y="180" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="30" font-weight="600" fill="#9AA3AF">👋 嗨，Paddy</text>
  <text x="108" y="232" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="42" font-weight="800" fill="#0E1116">这周末，约起来</text>

  <!-- 数据概览卡 -->
  <rect x="108" y="280" width="424" height="150" rx="28" fill="#FFFFFF" opacity="0.72"/>
