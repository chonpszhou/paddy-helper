<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paddy小助手 · 网页版</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🔥</text></svg>" />
  <style>
    :root {
      --ink: #0f172a;
      --ink-soft: #475569;
      --ink-faint: #64748b;
      --glass: rgba(255, 255, 255, 0.62);
      --glass-strong: rgba(255, 255, 255, 0.78);
      --line: rgba(255, 255, 255, 0.75);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --shadow: 0 18px 44px -18px rgba(30, 64, 175, 0.20), 0 6px 16px -8px rgba(30, 64, 175, 0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(120% 90% at 12% 6%, rgba(110, 231, 183, 0.24), transparent 55%),
        radial-gradient(110% 90% at 90% 10%, rgba(125, 211, 252, 0.26), transparent 55%),
        radial-gradient(120% 100% at 50% 105%, rgba(196, 181, 253, 0.24), transparent 60%),
        linear-gradient(180deg, #f8fbff, #f2f6fd 55%, #f6f2fc);
      padding: 18px 14px calc(30px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-radius: 999px;
      background: var(--glass); backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--line); box-shadow: var(--shadow);
      position: sticky; top: 8px; z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 15px;
      background: linear-gradient(135deg, #34d399, #38bdf8 55%, #a78bfa);
      box-shadow: 0 5px 12px -5px rgba(56, 189, 248, 0.6);
    }
    .header-tag { font-size: 11px; color: var(--ink-faint); }

    .card {
      background: var(--glass); backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
      padding: 24px 20px; margin-top: 18px;
      transition: transform 0.4s var(--spring), box-shadow 0.35s var(--ease);
    }
    .card:active { transform: scale(0.985); }

    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    h2 { font-size: 20px; font-weight: 800; }
    .sub { color: var(--ink-soft); font-size: 14px; margin-top: 8px; line-height: 1.6; }
    .muted { color: var(--ink-faint); font-size: 12.5px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 50px; border: none; border-radius: 999px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform 0.35s var(--spring), box-shadow 0.3s var(--ease);
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary {
      color: #fff; background: linear-gradient(135deg, #10b981, #0ea5e9 58%, #8b5cf6);
      box-shadow: 0 12px 26px -10px rgba(14, 165, 233, 0.55);
    }
    .btn-ghost {
      color: var(--ink); background: rgba(255,255,255,0.6);
      border: 1px solid var(--line);
    }
    .btn[disabled] { opacity: 0.6; pointer-events: none; }
    .btn .spin {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
      animation: rot 0.8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }

    .input {
      width: 100%; height: 52px; border-radius: 16px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.75); padding: 0 16px; font-size: 16px; color: var(--ink);
      outline: none; letter-spacing: 2px;
    }
    .input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.18); }

    .activity-item {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 14px; border-radius: 18px; cursor: pointer;
      background: rgba(255,255,255,0.55); border: 1px solid var(--line);
      margin-top: 12px; transition: transform 0.3s var(--spring), background 0.25s;
    }
    .activity-item:hover { transform: translateY(-2px); background: var(--glass-strong); }
    .a-icon {
      width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
      background: linear-gradient(135deg, #a7f3d0, #bae6fd 55%, #ddd6fe);
    }
    .a-main { flex: 1; min-width: 0; }
    .a-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .a-meta { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }

    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 800; margin-bottom: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .photo-item {
      position: relative; border-radius: 14px; overflow: hidden;
      background: #eef0f3; aspect-ratio: 1;
    }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-rank {
      position: absolute; top: 5px; left: 5px; font-size: 17px; line-height: 1;
      text-shadow: 0 1px 4px rgba(0,0,0,0.35); z-index: 2;
    }
    .photo-votes {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; gap: 5px; padding: 5px;
      background: linear-gradient(180deg, transparent, rgba(15,23,42,0.55));
    }
    .vote-btn {
      flex: 1; border: none; border-radius: 999px; height: 24px;
      font-size: 11px; font-weight: 700; cursor: pointer;
      background: rgba(255,255,255,0.82); color: #334155;
      transition: transform 0.25s var(--spring);
    }
    .vote-btn:active { transform: scale(0.9); }
    .vote-btn.on { background: #07c160; color: #fff; }
    .vote-btn.on-bad { background: #0f172a; color: #fff; }

    .upload-btn {
      margin-top: 14px; height: 46px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(7,193,96,0.12); color: #059669; font-weight: 700; font-size: 14px;
      cursor: pointer; border: 1px dashed rgba(7,193,96,0.4);
    }
    .empty { text-align: center; color: var(--ink-faint); font-size: 13px; padding: 14px 0; }

    .comment { padding: 12px 2px; border-bottom: 1px solid rgba(15,23,42,0.06); }
    .comment:last-of-type { border-bottom: none; }
    .comment-head { display: flex; justify-content: space-between; align-items: baseline; }
    .comment-name { font-size: 13px; font-weight: 700; color: #059669; }
    .comment-time { font-size: 11px; color: #9aa3af; }
    .comment-text { font-size: 14px; margin-top: 4px; color: var(--ink); line-height: 1.5; }
    .comment-row { display: flex; gap: 10px; margin-top: 12px; }
    .comment-row input {
      flex: 1; height: 44px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.75); padding: 0 16px; font-size: 14px; outline: none;
    }
    .comment-send {
      border: none; border-radius: 999px; padding: 0 22px;
      background: #07c160; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }

    .ai-box {
      margin-top: 14px; border-radius: 16px; padding: 14px;
      background: rgba(255,255,255,0.6); border: 1px solid var(--line);
      font-size: 14px; color: var(--ink-soft); line-height: 1.7; white-space: pre-wrap;
      display: none;
    }

    .toast {
      position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
      background: rgba(15,23,42,0.88); color: #fff; font-size: 13px;
      padding: 10px 20px; border-radius: 999px; z-index: 99;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      max-width: 80vw; text-align: center;
    }
    .toast.show { opacity: 1; }

    .hidden { display: none !important; }
    .back-row { display: flex; gap: 10px; margin-top: 4px; }
    .back-row .btn { width: auto; padding: 0 22px; height: 44px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="brand-mark">🔥</span>Paddy小助手</div>
      <span class="header-tag">网页版 · 完整功能</span>
    </header>

    <!-- 视图 1：通行码 -->
    <section id="view-code" class="card" style="margin-top:22px;">
      <h1>🔑 进入圈子</h1>
      <p class="sub">输入朋友发给你的圈子通行码，查看这个圈子的活动相册、留言，还能用 AI 写小记。</p>
      <input id="code-input" class="input" style="margin-top:20px;" placeholder="8 位通行码，比如 K7M2PQX9" maxlength="20" />
      <button id="code-btn" class="btn btn-primary" style="margin-top:16px;">进入圈子</button>
      <p id="code-err" class="muted" style="margin-top:12px; color:#e11d48; text-align:center;"></p>
      <div style="text-align:center; margin-top:16px;">
        <a id="toggle-create" style="color:#2563eb; font-size:14px; cursor:pointer;">还没有圈子？点这里创建一个 →</a>
      </div>
      <div id="create-form" class="hidden" style="margin-top:18px;">
        <div class="form-label" style="font-size:14px; font-weight:700; margin-bottom:8px;">✨ 创建新圈子</div>
        <input id="create-name" class="input" placeholder="圈子名称，比如：周末干饭局" maxlength="20" />
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button id="create-btn" class="btn btn-primary" style="flex:1; height:46px; font-size:15px;">创建</button>
          <button id="create-cancel" class="btn btn-ghost" style="flex:1; height:46px; font-size:15px;">取消</button>
        </div>
        <p id="create-err" class="muted" style="margin-top:10px; color:#e11d48; text-align:center;"></p>
      </div>
    </section>

    <!-- 视图 2：活动列表 -->
    <section id="view-list" class="hidden">
      <div class="card">
        <div class="back-row">
          <button id="exit-btn" class="btn btn-ghost">退出圈子</button>
        </div>
        <h2 style="margin-top:16px;" id="list-circle-name">圈子活动</h2>
        <p class="sub">选择一个活动，看看大家的照片和留言 👇</p>
        <div id="activity-list"></div>
      </div>
    </section>

    <!-- 视图 3：活动详情 -->
    <section id="view-detail" class="hidden">
      <div class="card">
        <div class="back-row">
          <button id="back-btn" class="btn btn-ghost">← 返回列表</button>
        </div>
        <div style="margin-top:16px;" id="detail-info"></div>
      </div>

      <div class="card">
        <div class="section-title"><span class="dot" style="background:#f59e0b;"></span>活动相册<text class="muted" id="photo-count"></text></div>
        <div id="photo-grid" class="photo-grid"></div>
        <div class="upload-btn" id="upload-btn">📷 上传照片（匿名）</div>
        <input id="file-input" type="file" accept="image/*" multiple style="display:none;" />
      </div>

      <div class="card">
        <div class="section-title"><span class="dot" style="background:#3b82f6;"></span>留言</div>
        <div id="comment-list"></div>
        <div class="comment-row">
          <input id="comment-input" placeholder="说点什么…" maxlength="200" />
          <button id="comment-send" class="comment-send">发送</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title"><span class="dot" style="background:#8b5cf6;"></span>✨ AI 活动小记</div>
        <p class="sub">根据活动信息和大家的留言、照片，生成一段温暖总结。</p>
        <button id="ai-btn" class="btn btn-primary" style="margin-top:14px;">✨ 生成小记</button>
        <div id="ai-box" class="ai-box"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.17.3/cloudbase.full.js"></script>
  <script>
    (function () {
      'use strict';

      // ===== 配置：云环境 ID（与小程序同一个云环境） =====
      var ENV_ID = 'wechatminiprogram-d1d9q1d1ae383e'

      var $ = function (id) { return document.getElementById(id) }
      var state = { code: '', circle: null, activities: [], activity: null, loading: false }

      var TYPE_META = {
        dinner: { icon: '🍲', name: '聚餐' },
        outdoor: { icon: '⛺', name: '户外' },
        group: { icon: '🎲', name: '团体' },
        trip: { icon: '✈️', name: '旅行' }
      }

      function toast(msg) {
        var t = $('toast')
        t.textContent = msg
        t.classList.add('show')
        clearTimeout(t._timer)
        t._timer = setTimeout(function () { t.classList.remove('show') }, 2200)
      }

      function getUid() {
        var k = 'paddy_h5_uid'
        var v = localStorage.getItem(k)
        if (!v) {
          v = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
          localStorage.setItem(k, v)
        }
        return v
      }

      function getCode() {
        var c = localStorage.getItem('paddy_h5_code')
        return c ? c.toUpperCase() : ''
      }

      function ensureName(cb) {
        var name = localStorage.getItem('paddy_h5_name')
        if (name) { cb(name); return }
        var v = prompt('留言时用哪个名字？', '朋友')
        v = (v || '').trim().slice(0, 20) || '朋友'
        localStorage.setItem('paddy_h5_name', v)
        cb(v)
      }

      function show(view) {
        ;['view-code', 'view-list', 'view-detail'].forEach(function (id) {
          $(id).classList.toggle('hidden', id !== view)
        })
      }

      function fmtTime(t) {
        if (!t) return ''
        var d = new Date(t)
        if (isNaN(d.getTime())) return ''
        var p = function (n) { return (n < 10 ? '0' : '') + n }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
      }

      // ===== 云函数调用 =====
      var app = null
      var authed = false

      function initCloud() {
        if (app) return Promise.resolve()
        if (!window.cloudbase) {
          toast('云开发 SDK 加载失败，请检查网络')
          return Promise.reject(new Error('sdk missing'))
        }
        app = cloudbase.init({ env: ENV_ID })
        return app.auth({ persistence: 'local' }).anonymousAuthProvider().signIn()
          .then(function () {
            authed = true
          })
          .catch(function (e) {
            toast('云环境初始化失败：请确认已开启匿名登录')
            throw e
          })
      }

      function callFn(data) {
        return initCloud().then(function () {
          return app.callFunction({ name: 'h5api', data: Object.assign({ code: state.code }, data) })
        }).then(function (res) {
          var r = res && res.result
          if (!r || !r.ok) {
            var msg = (r && r.error) || '操作失败'
            throw new Error(msg)
          }
          return r
        })
      }

      // ===== 视图 1：通行码 =====
      function bindPasscode() {
        $('code-btn').addEventListener('click', function () {
          var code = $('code-input').value.trim().toUpperCase()
          if (!code) { toast('先输入通行码'); return }
          state.code = code
          $('code-err').textContent = ''
          $('code-btn').disabled = true
          $('code-btn').innerHTML = '<span class="spin"></span>验证中…'
          callFn({ action: 'verifyCircle' }).then(function (r) {
            state.circle = r.circle
            localStorage.setItem('paddy_h5_code', code)
            loadList()
          }).catch(function (e) {
            $('code-err').textContent = e.message || '验证失败'
            $('code-btn').disabled = false
            $('code-btn').textContent = '进入圈子'
          })
        })
      }

      function toggleCreate(show) {
        $('create-form').classList.toggle('hidden', !show)
        $('create-err').textContent = ''
      }

      function doCreate() {
        var name = $('create-name').value.trim()
        if (!name) { $('create-err').textContent = '先给圈子起个名字'; return }
        $('create-btn').disabled = true
        $('create-btn').innerHTML = '<span class="spin"></span>创建中…'
        initCloud().then(function () {
          return callFn({ action: 'createCircle', name: name, uid: getUid() })
        }).then(function (r) {
          state.circle = r.circle
          state.code = r.circle.code
          localStorage.setItem('paddy_h5_code', r.circle.code)
          $('create-btn').disabled = false
          $('create-btn').textContent = '创建'
          toast('圈子「' + r.circle.name + '」创建成功 🎉')
          setTimeout(function () { loadList() }, 500)
        }).catch(function (e) {
          $('create-btn').disabled = false
          $('create-btn').textContent = '创建'
          $('create-err').textContent = e.message || '创建失败'
        })
      }

      function loadList() {
        $('list-circle-name').textContent = state.circle ? state.circle.name + ' · 活动列表' : '圈子活动'
        $('activity-list').innerHTML = '<div class="empty">加载中…</div>'
        callFn({ action: 'listActivities' }).then(function (r) {
          state.circle = r.circle
          state.activities = r.activities || []
          renderList()
          show('view-list')
        }).catch(function (e) {
          $('activity-list').innerHTML = '<div class="empty">' + (e.message || '加载失败') + '</div>'
        })
      }

      function renderList() {
        var box = $('activity-list')
        $('list-circle-name').textContent = state.circle.name + ' · 活动列表'
        if (!state.activities.length) {
          box.innerHTML = '<div class="empty">这个圈子还没有活动，先去小程序里发起一个吧 🎉</div>'
          return
        }
        box.innerHTML = ''
        state.activities.forEach(function (a) {
          var meta = TYPE_META[a.type] || { icon: '📌', name: '活动' }
          var el = document.createElement('div')
          el.className = 'activity-item'
          el.innerHTML =
            '<div class="a-icon">' + meta.icon + '</div>' +
            '<div class="a-main">' +
            '<div class="a-title">' + esc(a.title) + '</div>' +
            '<div class="a-meta">🕐 ' + fmtTime(a.startTime) + ' · 📍 ' + esc(a.location || '地点待定') + ' · 👥 ' + a.signupCount + ' 人</div>' +
            '</div>'
          el.addEventListener('click', function () { openDetail(a._id) })
          box.appendChild(el)
        })
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        })
      }

      // ===== 视图 3：活动详情 =====
      var currentActivityId = ''

      function openDetail(id) {
        currentActivityId = id
        $('detail-info').innerHTML = '<div class="empty">加载中…</div>'
        show('view-detail')
        callFn({ action: 'getActivity', activityId: id }).then(function (r) {
          state.activity = r.activity
          renderDetail()
        }).catch(function (e) {
          $('detail-info').innerHTML = '<div class="empty">' + (e.message || '加载失败') + '</div>'
        })
      }

      function renderDetail() {
        var a = state.activity
        var meta = TYPE_META[a.type] || { icon: '📌', name: '活动' }
        $('detail-info').innerHTML =
          '<div class="a-icon" style="width:54px;height:54px;font-size:26px;margin-bottom:12px;">' + meta.icon + '</div>' +
          '<h2>' + esc(a.title) + '</h2>' +
          '<p class="sub" style="margin-top:10px;">🕐 ' + fmtTime(a.startTime) + '</p>' +
          '<p class="sub">📍 ' + esc(a.location || '地点待定') + '</p>' +
          (a.description ? '<p class="sub">📝 ' + esc(a.description) + '</p>' : '') +
          '<p class="muted" style="margin-top:10px;">👥 ' + a.signupCount + ' 人报名 · 🙋 ' + esc(a.creatorName || '发起人') + '</p>'
        renderPhotos(a.photos || [])
        renderComments(a.comments || [])
        $('ai-box').classList.add('hidden')
        $('ai-box').textContent = ''
      }

      function photoScore(p) {
        return (p.likes || []).length - (p.dislikes || []).length
      }

      function renderPhotos(photos) {
        var uid = getUid()
        var ranked = (photos || []).slice().sort(function (x, y) { return photoScore(y) - photoScore(x) })
        var rankMap = {}
        ranked.forEach(function (p, i) {
          if (i === 0) rankMap[p.id] = '🥇'
          else if (i === 1) rankMap[p.id] = '🥈'
          else if (i === 2) rankMap[p.id] = '🥉'
        })
        var grid = $('photo-grid')
        $('photo-count').textContent = photos.length ? ' · ' + photos.length + ' 张' : ''
        if (!photos.length) {
          grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">📸 还没有照片，传一张吧</div>'
          return
        }
        grid.innerHTML = ''
        photos.forEach(function (p) {
          var score = photoScore(p)
          var el = document.createElement('div')
          el.className = 'photo-item'
          el.innerHTML =
            (rankMap[p.id] ? '<span class="photo-rank">' + rankMap[p.id] + '</span>' : '') +
            '<img src="' + esc(p.src) + '" alt="活动照片" loading="lazy" />' +
            '<div class="photo-votes">' +
            '<button class="vote-btn ' + ((p.likes || []).indexOf(uid) >= 0 ? 'on' : '') + '" data-id="' + p.id + '" data-type="like">👍 ' + (p.likes || []).length + '</button>' +
            '<button class="vote-btn ' + ((p.dislikes || []).indexOf(uid) >= 0 ? 'on-bad' : '') + '" data-id="' + p.id + '" data-type="dislike">👎 ' + (p.dislikes || []).length + '</button>' +
            '<span style="position:absolute;right:5px;bottom:31px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);">' + (score > 0 ? '+' : '') + score + '</span>' +
            '</div>'
          el.querySelectorAll('.vote-btn').forEach(function (b) {
            b.addEventListener('click', function () {
              var type = b.getAttribute('data-type')
              var pid = b.getAttribute('data-id')
              callFn({ action: 'toggleVote', activityId: currentActivityId, photoId: pid, uid: uid, type: type })
                .then(function (r) {
                  state.activity.photos = r.photos || state.activity.photos
                  renderPhotos(state.activity.photos)
                })
                .catch(function (e) { toast(e.message) })
            })
          })
          grid.appendChild(el)
        })
      }

      // ===== 上传照片 =====
      function compressImage(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader()
          reader.onload = function (e) {
            var img = new Image()
            img.onload = function () {
              var max = 1200
              var w = img.width, h = img.height
              if (w > max || h > max) {
                var ratio = Math.min(max / w, max / h)
                w = Math.round(w * ratio)
                h = Math.round(h * ratio)
              }
              var canvas = document.createElement('canvas')
              canvas.width = w; canvas.height = h
              canvas.getContext('2d').drawImage(img, 0, 0, w, h)
              resolve(canvas.toDataURL('image/jpeg', 0.8))
            }
            img.onerror = function () { reject(new Error('图片解析失败')) }
            img.src = e.target.result
          }
          reader.onerror = function () { reject(new Error('读取失败')) }
          reader.readAsDataURL(file)
        })
      }

      function uploadPhotos(files) {
        var list = Array.prototype.slice.call(files).slice(0, 9)
        if (!list.length) return
        var btn = $('upload-btn')
        btn.style.pointerEvents = 'none'
        btn.textContent = '上传中 0/' + list.length + '…'
        var i = 0
        var done = 0
        var next = function () {
          if (i >= list.length) {
            btn.innerHTML = '📷 上传照片（匿名）'
            btn.style.pointerEvents = ''
            toast('已上传 ' + done + ' 张 🎉')
            callFn({ action: 'getActivity', activityId: currentActivityId }).then(function (r) {
              state.activity = r.activity
              renderPhotos(state.activity.photos)
            })
            return
          }
          compressImage(list[i]).then(function (dataUrl) {
            return callFn({ action: 'addPhoto', activityId: currentActivityId, dataUrl: dataUrl })
          }).then(function () {
            done++
            i++
            btn.textContent = '上传中 ' + done + '/' + list.length + '…'
            next()
          }).catch(function (e) {
            i++
            btn.textContent = '上传中 ' + done + '/' + list.length + '…'
            toast(e.message || '上传失败')
            next()
          })
        }
        next()
      }

      // ===== 留言 =====
      function renderComments(comments) {
        var box = $('comment-list')
        if (!comments.length) {
          box.innerHTML = '<div class="empty">💬 还没有留言</div>'
          return
        }
        box.innerHTML = ''
        comments.forEach(function (c) {
          var el = document.createElement('div')
          el.className = 'comment'
          el.innerHTML =
            '<div class="comment-head"><span class="comment-name">' + esc(c.author) + '</span><span class="comment-time">' + fmtTime(c.at) + '</span></div>' +
            '<div class="comment-text">' + esc(c.text) + '</div>'
          box.appendChild(el)
        })
      }

      function sendComment() {
        var input = $('comment-input')
        var text = input.value.trim()
        if (!text) { toast('写点内容再发吧'); return }
        ensureName(function (name) {
          $('comment-send').disabled = true
          callFn({ action: 'addComment', activityId: currentActivityId, author: name, text: text })
            .then(function () {
              input.value = ''
              $('comment-send').disabled = false
              return callFn({ action: 'getActivity', activityId: currentActivityId })
            })
            .then(function (r) {
              state.activity = r.activity
              renderComments(state.activity.comments)
            })
            .catch(function (e) {
              $('comment-send').disabled = false
              toast(e.message)
            })
        })
      }

      // ===== AI 小记 =====
      function genAiSummary() {
        var box = $('ai-box')
        $('ai-btn').disabled = true
        $('ai-btn').innerHTML = '<span class="spin"></span>AI 写小记中…'
        box.classList.remove('hidden')
        box.textContent = 'AI 正在组织语言…'
        callFn({ action: 'aiCall', activityId: currentActivityId, aiAction: 'summary' })
          .then(function (r) {
            box.textContent = (r.data && r.data.text) || 'AI 没写出来，再试一次'
          })
          .catch(function (e) {
            box.textContent = e.message || 'AI 生成失败'
          })
          .finally(function () {
            $('ai-btn').disabled = false
            $('ai-btn').textContent = '✨ 再生成一次'
          })
      }

      // ===== 事件绑定 =====
      function bindEvents() {
        bindPasscode()
        $('toggle-create').addEventListener('click', function () { toggleCreate(true) })
        $('create-cancel').addEventListener('click', function () { toggleCreate(false) })
        $('create-btn').addEventListener('click', doCreate)
        $('create-name').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') doCreate()
        })
        $('exit-btn').addEventListener('click', function () {
          localStorage.removeItem('paddy_h5_code')
          state.code = ''
          state.circle = null
          $('code-input').value = ''
          show('view-code')
        })
        $('back-btn').addEventListener('click', function () {
          show('view-list')
        })
        $('upload-btn').addEventListener('click', function () {
          $('file-input').click()
        })
        $('file-input').addEventListener('change', function (e) {
          uploadPhotos(e.target.files)
          e.target.value = ''
        })
        $('comment-send').addEventListener('click', sendComment)
        $('comment-input').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') sendComment()
        })
        $('ai-btn').addEventListener('click', genAiSummary)
      }

      // ===== 启动 =====
      bindEvents()
      var saved = getCode()
      if (saved) {
        state.code = saved
        $('code-input').value = saved
        initCloud().then(function () {
          return callFn({ action: 'verifyCircle' })
        }).then(function (r) {
          state.circle = r.circle
          loadList()
        }).catch(function () {
          show('view-code')
        })
      } else {
        show('view-code')
      }
    })()
  </script>
</body>
</html>
