  <text x="160" y="395" font-family="sans-serif" font-size="24" fill="#6B7480" text-anchor="middle">进行中</text>
  <text x="320" y="350" font-family="sans-serif" font-size="44" font-weight="800" fill="#8B5CF6" text-anchor="middle">3</text>
  <text x="320" y="395" font-family="sans-serif" font-size="24" fill="#6B7480" text-anchor="middle">已参加</text>
  <text x="480" y="350" font-family="sans-serif" font-size="44" font-weight="800" fill="#0EA5E9" text-anchor="middle">4</text>
  <text x="480" y="395" font-family="sans-serif" font-size="24" fill="#6B7480" text-anchor="middle">类型数</text>

  <!-- 筛选 chips -->
