<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f3fbf6"/>
      <stop offset="55%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f6f1ff"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9A6C"/>
      <stop offset="100%" stop-color="#FFC371"/>
